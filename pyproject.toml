[project]
name = "rzvid"
version = "0.1.0"
description = "RzVid - Video & Audio Downloader"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "yt-dlp>=2025.2.19",
  "static-ffmpeg>=2.5",
  "aiofiles==23.2.1",
  "curl-cffi==0.14.0",
  "yt-dlp-ejs==0.8.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.vercel]
entrypoint = "backend.main:app"
