    <!-- Tailwind CSS Play CDN -->

    <!-- Babel Standalone for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Anti-F12 and Source Protection -->
    <script>
        // Disable Right-Click context menu
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Disable developer tool keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { // F12
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { // Ctrl+Shift+I/J/C
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.keyCode === 85) { // Ctrl+U (View Source)
                e.preventDefault();
                return false;
            }
            if (e.ctrlKey && e.keyCode === 83) { // Ctrl+S (Save Page)
                e.preventDefault();
                return false;
            }
        });

        // Anti-debugging loop: instantly freezes execution if DevTools is opened
        setInterval(function() {
            (function() {
                try {
                    (function a(i) {
                        if (("" + i / i).length !== 1 || i % 20 === 0) {
                            (function() {}).constructor("debugger")();
                        } else {
                            debugger;
                        }
                        a(++i);
                    })(0);
                } catch (e) {}
            })();
        }, 200);
    </script>

<body class="text-slate-200 min-h-screen bg-grid-pattern relative overflow-x-hidden">

    <!-- Three.js canvas container for 3D background -->
    <canvas id="three-canvas" class="fixed inset-0 w-full h-full -z-20 pointer-events-none opacity-50"></canvas>

    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-[1400px] h-[600px] bg-gradient-to-b from-indigo-500/5 via-violet-500/2 to-transparent blur-[140px] pointer-events-none -z-10"></div>
    <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-indigo-500/2 blur-[160px] pointer-events-none -z-10"></div>

    <!-- React App Root Container -->
    <div id="root"></div>

    <!-- Background 3D Script & React App Module -->
    <script src="three-bg.js"></script>
    <script type="text/babel" data-type="module" src="app.js"></script>
</body>
